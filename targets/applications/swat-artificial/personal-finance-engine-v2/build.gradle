plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
}

group = 'de.uzl.its.targets'
version = '0.0.1-SNAPSHOT'

def javaVer = JavaVersion.VERSION_17
java {
    sourceCompatibility = javaVer
    targetCompatibility = javaVer
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.5')
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    // implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation("com.fasterxml.jackson.core:jackson-databind:2.20.0")

    implementation("org.projectlombok:lombok:1.18.42")
    // compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    // testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }
// Inserted bugs for the SA experiments (../../http_sa_campaign.py): -Pbug=<name> switches one on.
// They are compile-time constants, so javac leaves the others out of the bytecode, and the static
// pre-analysis only sees the assert of the bug that is on.
def bugs = ['csv-escaped-quote', 'header-one-column', 'merge-duplicate', 'filter-query']
def activeBug = project.findProperty('bug') ?: 'none'
def bugsDir = layout.buildDirectory.dir('generated/sources/bugs/java/main')
tasks.register('generateBugs') {
    inputs.property('bug', activeBug)
    outputs.dir(bugsDir)
    doLast {
        def f = bugsDir.get().file('de/uzl/its/targets/finance_engine/Bugs.java').asFile
        f.parentFile.mkdirs()
        f.text = "package de.uzl.its.targets.finance_engine;\n\n/** Generated: which inserted bug is on (-Pbug=...). */\npublic final class Bugs {\n" +
                bugs.collect { "    public static final boolean ${it.toUpperCase().replace('-', '_')} = ${it == activeBug};\n" }.join() +
                "    private Bugs() {}\n}\n"
    }
}
sourceSets.main.java.srcDir(bugsDir)
tasks.named('compileJava') { dependsOn 'generateBugs' }
